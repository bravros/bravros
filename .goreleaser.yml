version: 2

project_name: bravros

# Builds the signed payload asset (skills/ + templates/) that `bravros selfupdate`
# fetches at runtime — see cli/internal/fetch. Runs from the repo root (this file's
# directory), so the paths inside the tarball are `skills/...` and `templates/...`.
#
# The generate hook runs FIRST so the binary's compiled-in cli/internal/payload
# mirror (see cli/internal/payload/embed.go) can never go stale at release time,
# even if CI's drift check somehow didn't catch it — go:embed reads whatever is
# on disk in cli/internal/payload/{skills,templates} at build time.
before:
  hooks:
    - sh -c "cd cli && go generate ./internal/payload/..."
    - sh -c "tar -czf bravros-payload.tar.gz skills templates"

builds:
  - id: bravros
    dir: cli
    main: .
    binary: bravros
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    # No `ignore:` block. linux/arm64 was blocked here AND in install.sh:35-37;
    # P-0015 Phase 5 unblocks both in the same change, because unblocking one
    # alone either offers a target the release never publishes or publishes a
    # target the installer refuses. windows/{amd64,arm64} joins as the native
    # degraded tier (D3) — GoReleaser appends .exe to `binary: bravros` itself.
    # Six builds total: {darwin,linux,windows} x {amd64,arm64}.
    ldflags:
      # Version var lives in cmd package (see cli/cmd/root.go `var Version`).
      # Prepend `v` so the print path (`strings.TrimPrefix(Version, "v")`)
      # yields the right string and matches git tag conventions.
      - -s -w -X github.com/bravros/bravros/cli/cmd.Version=v{{.Version}}

archives:
  - id: bravros
    # `formats` (plural, list) — `format` was deprecated in GoReleaser v2.
    # install.sh fetches bravros-<os>-<arch>.tar.gz, so this name_template and
    # the tar.gz format are load-bearing: changing either breaks every installer.
    #
    # The name_template is UNCHANGED on purpose (P-0015 D4). Four independent
    # places recompute this exact string — install.sh, install.ps1, the generated
    # Homebrew formula, and release.yml's verify gate — so the spec's proposed
    # `bravros_{version}_{os}_{arch}` rename was rejected. Friendly labels
    # ("Mac (M series)") live in the docs, never in asset names.
    formats: [tar.gz]
    name_template: "bravros-{{ .Os }}-{{ .Arch }}"
    # Windows gets .zip because Windows has no native tar.gz story that
    # PowerShell 5.1 can unpack; Expand-Archive handles zip out of the box.
    # install.ps1 therefore fetches bravros-windows-<arch>.zip.
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: 'checksums.txt'
  # Folds bravros-payload.tar.gz's sha256 into checksums.txt so it rides the same
  # minisign signature chain as the platform binaries — no second signing key.
  # The two installer scripts ride along for the same reason: a user who wants to
  # audit the one-liner before running it can verify install.sh / install.ps1
  # against the signed checksums.txt instead of trusting the CDN.
  extra_files:
    - glob: bravros-payload.tar.gz
    - glob: install.sh
    - glob: install.ps1

signs:
  - artifacts: checksum
    cmd: sh
    args:
      - "-c"
      - |
        set -e
        trap 'rm -f /tmp/bravros.key' EXIT
        # MINISIGN_SECRET_KEY is stored in GH Secrets as raw minisign format
        # (untrusted comment: ... \n <base64-payload>). Write it straight — no outer base64.
        printf '%s\n' "${MINISIGN_SECRET_KEY}" > /tmp/bravros.key
        # minisign -W: no password (the key was generated with -W to skip the password prompt)
        minisign -S -W -m "${artifact}" -s /tmp/bravros.key -t "Bravros release v{{ .Version }}"
    signature: "${artifact}.minisig"
    env:
      - MINISIGN_SECRET_KEY

release:
  github:
    owner: bravros
    name: bravros
  # install.bravros.dev is a Cloudflare Worker that proxies
  # releases/latest/download/install.sh. Without this block that URL 404s and the
  # worker answers 503 — which is exactly how the installer broke after install.sh
  # moved into this monorepo and the old cross-repo sync step disappeared.
  # Attaching it here also keeps the installer in lockstep with the binaries it
  # installs, since each release carries the script that fetches it.
  # install.ps1 is the Windows half of the same contract: the release must carry
  # the script that fetches it, or install.bravros.dev/install.ps1 404s exactly
  # the way install.sh did when the cross-repo sync step disappeared.
  extra_files:
    - glob: install.sh
    - glob: install.ps1
    - glob: bravros-payload.tar.gz

brews:
  - name: bravros
    repository:
      owner: bravros
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://bravros.dev"
    description: "Bravros — free, public, host-neutral agent toolkit"
    license: "MIT"
    install: |
      bin.install "bravros"
    # Note: no `custom_block: verify do ... end` — that stanza is not valid
    # Homebrew DSL and broke `brew install` in v2.0.0. Signature verification
    # lives in the `curl | sh` installer path (checksums.txt.minisig against
    # the pinned minisign pubkey). Homebrew has no native minisign hook.
    caveats: |
      Run `bravros init` to initialize the project, install hooks, and configure Claude Code.
    test: |
      system "#{bin}/bravros", "version"
      # Match the actual lowercase "bravros vX.Y.Z" emitted by `bravros version`.
      # The previous "Bravros" (capital B) was case-sensitive and broke `brew test`.
      assert_match(/^bravros v\d+\.\d+\.\d+/, shell_output("#{bin}/bravros version"))
