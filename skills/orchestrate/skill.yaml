category: sdlc
icon: workflow
metadata:
  en:
    name: orchestrate
    description: Orchestrate implementation from a .planning dossier folder — subagents write the code, the session reads, dispatches by model tier, verifies diffs, and commits per phase. Use on /orchestrate [folder] or "implement from this .planning folder".
  br:
    name: orquestrar
    description: Orquestra a implementação a partir de uma pasta de dossiê em .planning — os subagentes escrevem o código, a sessão lê, despacha por nível de modelo, verifica diffs e faz commits por fase. Use com /orchestrate [pasta] ou "implemente a partir desta pasta .planning".
  es:
    name: orquestar
    description: Orquesta la implementación desde una carpeta de dossier en .planning — los subagentes escriben el código, la sesión lee, despacha por nivel de modelo, verifica diffs y realiza commits por fase. Use con /orchestrate [carpeta] o "implementa desde esta carpeta .planning".
body: |
  Read [briefing.md](file:///Users/skaisser/Sites/bravros/skills/orchestrate/references/briefing.md) on demand for detailed context and instructions.

  You are the ORCHESTRATOR. Subagents write the product code; you read, decompose, dispatch, verify diffs, and keep the task list as the single source of truth. Never write product code directly.

  Key Execution Steps:
  1. Step 0: Resolve and absorb dossier folder in `.planning/`. Read all files/events. Validate premises against live code.
  2. Step 1: Determine phases (derive or adopt dossier phases `[H]/[S]/[O]`). Track via TaskCreate.
  3. Worktree lock: Validate working tree (`pwd && git branch --show-current`).
  4. Dispatch: Assign model tier per phase (`opus` for implementation, `sonnet` for test authoring, `haiku` for verification). Set `model` explicitly.
  5. Per-phase loop: Dispatch -> haiku verification -> review diff -> commit via `bravros commit` -> mark task done.
  6. Announce on completion via `bravros ha say`.
