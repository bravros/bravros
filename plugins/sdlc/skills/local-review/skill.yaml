body: |
  Read [briefing.md](file:///Users/skaisser/Sites/bravros/skills/local-review/references/briefing.md) on demand for detailed context and instructions.

  # local-review

  INTENT: Run a full PR review locally using a fresh subagent with zero context. Findings are saved, posted to the PR, and routed.

  HARD CONSTRAINTS:
  - Orchestrating session MUST NOT write the review. Dispatch ONE subagent (`code-reviewer`).
  - Never writes `.planning/.review-stamp-*.json` directly. Stamp authority is `bravros pr-review`.

  WORKFLOW:
  1. **Gather**: Fetch PR metadata, diff (`gh pr diff "$PR"`), and changed file list. Stop if empty.
  2. **Dispatch**: Send diff and context to `code-reviewer` agent (`sonnet` default, `opus` on `--deep`).
  3. **Parse & Save**: Extract `VERDICT_BLOCK`. Save to `.planning/pr-reviews/${PR}-<TS>.md`.
  4. **Post & Route**: Post comment via `gh pr comment` unless `--no-post`. Route to `/finish` or `/address-pr`.
