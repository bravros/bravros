name: Verify Skills and Manifests

on:
  push:
    branches: [ main ]
    paths:
      - 'skills/**'
      - 'tools/skillgen/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'skills/**'
      - 'tools/skillgen/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/skillgen/go.mod
          cache-dependency-path: tools/skillgen/go.sum

      - name: Build and run skillgen
        run: |
          cd tools/skillgen
          go build -o ../../skillgen main.go
          cd ../..
          ./skillgen
          rm skillgen

      - name: Check for unexpected changes or diffs vs golden files
        run: |
          git diff --exit-code CLAUDE.md GEMINI.md AGENTS.md .cursorrules
          git diff --exit-code tools/skillgen/expected/
