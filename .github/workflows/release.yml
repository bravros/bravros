name: Release CLI

# Builds and publishes a release when a vX.Y.Z tag lands.
#
# This MUST go through GoReleaser. The previous version of this workflow was a
# plain `go build` matrix that uploaded three bare binaries, which produced a
# v0.1.0 release with no `checksums.txt`, no `checksums.txt.minisig`, and no
# `.tar.gz` archives. install.sh curls all three with `curl -f` and dies on the
# first 404, so every `curl | sh` install failed. See .goreleaser.yml for the
# archive names, the checksum file, and the minisign `signs:` block that
# install.sh's pinned pubkey verifies against.
#
# Required secrets on this repository:
#   MINISIGN_SECRET_KEY  — signs checksums.txt (raw minisign format, no outer base64)
#   HOMEBREW_TAP_TOKEN   — lets the brews: block push to bravros/homebrew-tap
# Both currently live on bravros/private and must be copied here.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser needs full history and tags to compute the changelog.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      # The signs: block shells out to `minisign`; it is not on the runner by default.
      - name: Install minisign
        run: sudo apt-get update -qq && sudo apt-get install -y minisign

      - name: Fail fast if signing key is absent
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "${MINISIGN_SECRET_KEY}" ]; then
            echo "::error::MINISIGN_SECRET_KEY is not set on this repository."
            echo "Publishing unsigned artifacts would break install.sh, which verifies"
            echo "checksums.txt.minisig against a pinned pubkey. Copy the secret from"
            echo "bravros/private before tagging a release."
            exit 1
          fi

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Verify published artifacts match what install.sh fetches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          for a in checksums.txt checksums.txt.minisig bravros-darwin-arm64.tar.gz; do
            gh release view "${GITHUB_REF_NAME}" --json assets \
              --jq '.assets[].name' | grep -qx "$a" \
              || { echo "::error::release is missing $a — install.sh will 404"; exit 1; }
          done
          echo "All install.sh-required assets present."
