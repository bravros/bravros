category: sdlc
icon: git-merge
metadata:
  en:
    name: batch-merge-prs
    description: "Merge N open PRs in order to the staging branch (never main): verify, fix review feedback, close linked issues, hand off the suite. Use on /batch-merge-prs."
  br:
    name: batch-merge-prs
    description: Verifica N PRs, aborda feedback de revisão, realiza mesclagem ordenada no ramo de homologação (nunca main), fecha issues/backlog vinculados por mesclagem e transfere a suíte de testes completa. Use em /batch-merge-prs.
  es:
    name: batch-merge-prs
    description: Verifica N PRs, atiende los comentarios de revisión, realiza la combinación ordenada en la rama de homologación (nunca main), cierra los issues/pendientes vinculados por combinación y entrega la suite de pruebas completa. Use en /batch-merge-prs.
body: |
  Read [briefing.md](references/briefing.md) on demand for detailed context and instructions.

  INTENT: take N open PRs from open → verified → merged on the staging branch → linked issue/backlog closed per merge → full suite handed to operator. Staging = `bravros config get staging_branch`. Run from repo root.

  ## Hard constraints

  - **Never merge or push to `main`.** Production ships via operator's token-gated `/promote`.
  - **Guard seam:** executable `.bravros/guards/pre-merge.sh`, if present, runs before each merge; non-zero exit parks that PR for human review.
  - **Live-suite safety:** server-side merges only (`gh pr merge`) if suite is running on tree; defer local pulls/checkouts until free.
  - **No `--delete-branch` mid-batch** — heads stay recoverable until batch lands; prune after.
  - `blocked` verdict is a full stop — hand to operator, never auto-merge.

  ## Flow

  1. **Verify (parallel, read-only).** `STAGING=$(bravros config get staging_branch 2>/dev/null); STAGING=${STAGING:-homolog}; mkdir -p .claude/workflows; S=~/.bravros/skills/batch-merge-prs/scripts/verify-prs.js; D=.claude/workflows/verify-prs.js; cmp -s "$S" "$D" || cp -f "$S" "$D"` then run `Workflow({name:'verify-prs', args:{staging_branch, bot:'claude', guards:[…], prs:[…]}})`.
     Verdicts: clean → queue · needs-changes → fix-agent per PR, re-verify · superseded → close · blocked → stop. `deep` mode on free tree only.
  2. **Merge (SERIAL, ascending, one standalone call per PR).** Follow `skills/shared/merge-flow.md`. Re-check mergeability per PR. Default `--merge`. Conflict recovery & per-merge closeout: `references/merge-loop.md`.
  3. **Hand off suite — never deploy.** Operator runs suite in terminal. Staging regressions post-batch belong to the batch.

  ## Fleet Mode

  Autogenerated error-fix PRs (KPG-*/BetterStack): integration-branch flow, park rules, Linear sweep → `references/fleet-batch-verify.md`.

  ```bash
  bash ~/.agent_config/scripts/announce.sh --force "Mesclagem em lote concluída: <N> revisões publicadas em homologação. Ramo <fragmento>, projeto <repo>." studio || true
  ```
