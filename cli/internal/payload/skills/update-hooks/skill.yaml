  en:
    name: update-hooks
    description: Use to refresh git hooks in an existing project from the latest templates, keeping graphify post-* hooks. Not for first-time setup (/start).
  br:
    name: update-hooks
    description: Atualiza os githooks em um projeto existente para a versão mais recente.
  es:
    name: update-hooks
    description: Actualiza los githooks en un proyecto existente a la versión más reciente.
body: |
  INTENT: Update git hooks in an existing project to the latest version.

  ## Process

  ### 1. Check Prerequisites
  - Verify we're in a git repository
  - Check if `.bravros/hooks/` exists (if not, suggest `/start`)

  ### 2. Update Hooks
  ```bash
  bravros init
  ```

  **Preserve graphify delegators.** If the repo has `.graphify` or `graphify-out/graph.json`, the `post-{merge,commit,checkout}` hooks are graphify refresh delegators — back them up first (`cp` to a temp dir) and restore them after the refresh; never overwrite them.
